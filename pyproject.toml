[project]
name = "llqm"
version = "0.1.0"
description = "Timeline-first news and rumor investigation agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"langgraph>=0.2.35",
	"httpx>=0.27.2",
	"pydantic>=2.8.2",
	"streamlit>=1.44.0",
]

[project.scripts]
llqm = "llqm.cli:main"
llqm-ui = "llqm.ui.launcher:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llqm"]

[tool.hatch.build.targets.sdist]
include = [
	"src/llqm",
	"tests",
	"README.md",
	"pyproject.toml",
]

{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-12">
    <h1 class="text-3xl font-bold mb-2 text-[var(--text-primary)]">Timeline Investigator</h1>
    <p class="text-[var(--text-secondary)] mb-8">
        Trace rumors, verify claims, and build interactive timelines from news events.
    </p>

    <form action="/investigate" method="POST"
        class="space-y-6 bg-[var(--bg-secondary)] rounded-xl p-6 border border-[var(--border)]">

        <!-- Mode toggle -->
        <fieldset class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="rumor" checked onchange="document.getElementById('rumor-input').classList.remove('hidden');
                          document.getElementById('url-input').classList.add('hidden');"
                    class="accent-[var(--accent)]">
                <span>Rumor / Question</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="mode" value="url" onchange="document.getElementById('url-input').classList.remove('hidden');
                          document.getElementById('rumor-input').classList.add('hidden');"
                    class="accent-[var(--accent)]">
                <span>News URL</span>
            </label>
        </fieldset>

        <!-- Rumor input -->
        <div id="rumor-input">
            <label for="query" class="block text-sm font-medium mb-1 text-[var(--text-secondary)]">
                What do you want to investigate?
            </label>
            <input type="text" id="query" name="query" placeholder="Example: Did rumor X originate from account Y?"
                class="w-full px-4 py-3 rounded-lg
                    bg-[var(--bg-primary)] border border-[var(--border)]
                    text-[var(--text-primary)] placeholder-[var(--text-muted)]
                    focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
        </div>

        <!-- URL input -->
        <div id="url-input" class="hidden">
            <label for="url" class="block text-sm font-medium mb-1 text-[var(--text-secondary)]">
                Paste a news article URL
            </label>
            <input type="url" id="url" name="url" placeholder="https://www.reuters.com/world/..." class="w-full px-4 py-3 rounded-lg
                    bg-[var(--bg-primary)] border border-[var(--border)]
                    text-[var(--text-primary)] placeholder-[var(--text-muted)]
                    focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
        </div>

        <button type="submit" class="w-full py-3 px-6 rounded-lg font-semibold
                   bg-[var(--accent)] text-white
                   hover:opacity-90 transition-opacity">
            Investigate
        </button>
    </form>
</div>
{% endblock %}
